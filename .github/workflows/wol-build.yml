# 在 GitHub Actions 上构建「DS5Dongle + WoL」固件
#
# 为什么用云端构建：本机 xpack 工具链产出的固件在真机上 USB 枚举失败
# （同一份"完全原版源码"用官方工具链编就正常），差异只在工具链。
#
# 重要：这个 workflow **自己 clone 上游仓库的指定 ref**（默认 v0.7.2-hotfix），
# 不使用你 fork 里的分支内容 —— 因为 fork 默认停在 master，而 master 与你手上
# 能用的固件不是同一个版本（功能更多、RAM 更高）。你的 fork 只用来放：
#   - src/wol_config.h / lwipopts.h / wol_net.h / wol_net.cpp
#   - 这个 workflow 文件本身
#
# 复刻官方 CI（.github/workflows/build-firmware.yml）的关键点：
#   - Pico SDK 2.2.0
#   - TinyUSB 必须切到 0.20.0（不切会导致 TUD_AUDIO_EP_SIZE 宏签名不匹配）
#   - ARM 官方 GNU Toolchain 14.2.rel1
#   - Release 构建
#
# Wi-Fi 凭据有两种给法（二选一）：
#   A) 直接填进 src/wol_config.h 一起提交 —— 此时务必把仓库设为 Private！
#   B) 用仓库 Secrets（推荐，本 workflow 已支持）：
#        WOL_WIFI_SSID / WOL_WIFI_PASSWORD / WOL_KEY / WOL_WIFI_ENABLE
#      编译前自动注入，日志里把值打成 "***"

name: Build DS5 Bridge + WoL

on:
  workflow_dispatch:
    inputs:
      ds5_ref:
        description: 'DS5Dongle git ref (tag/branch/sha) —— 要与你想刷的固件同源'
        required: false
        default: 'v0.7.2-hotfix'
      version:
        description: 'Firmware version string'
        required: false
        default: 'v0.7.2-wol'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PICO_SDK_REF: '2.2.0'
      TINYUSB_REF: '0.20.0'
      DS5_REPO: 'https://github.com/awalol/DS5Dongle.git'
      DS5_DIR: ${{ github.workspace }}/ds5
    steps:
      - name: Checkout my fork (只为了拿 4 个 WoL 模块文件)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Clone DS5Dongle at pinned ref
        run: |
          git clone "$DS5_REPO" "$DS5_DIR"
          cd "$DS5_DIR"
          git checkout --detach "${{ inputs.ds5_ref }}"
          git submodule update --init --recursive
          echo "--- 源码版本 ---"
          git log -1 --oneline
          echo "--- add_executable 段（供排查）---"
          grep -n -A14 'add_executable(ds5-bridge' CMakeLists.txt || true

      - name: Copy WoL module files into source tree
        run: |
          cp fork/src/wol_config.h "$DS5_DIR/src/"
          cp fork/src/lwipopts.h   "$DS5_DIR/src/"
          cp fork/src/wol_net.h    "$DS5_DIR/src/"
          cp fork/src/wol_net.cpp  "$DS5_DIR/src/"
          echo "--- 已放入的模块文件 ---"
          ls -l "$DS5_DIR/src/" | grep -i wol

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build gcc g++ python3 xz-utils

      - name: Download ARM GNU Toolchain 14.2.rel1
        run: |
          mkdir -p "$HOME/arm-toolchain"
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C "$HOME/arm-toolchain" --strip-components=1
          "$HOME/arm-toolchain/bin/arm-none-eabi-gcc" --version | head -1

      - name: Clone Pico SDK with submodules
        run: |
          git clone --depth 1 --branch "${PICO_SDK_REF}" https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          git -C "$HOME/pico-sdk" submodule update --init --recursive

      - name: Switch TinyUSB to configured tag
        run: |
          cd "$HOME/pico-sdk/lib/tinyusb"
          if ! git rev-parse -q --verify "refs/tags/${TINYUSB_REF}" >/dev/null; then
            git fetch --depth 1 origin "refs/tags/${TINYUSB_REF}:refs/tags/${TINYUSB_REF}"
          fi
          git checkout --detach "${TINYUSB_REF}"
          echo "TinyUSB now at: $(git describe --tags --always)"

      - name: Patch CMakeLists.txt and src/main.cpp
        working-directory: ${{ env.DS5_DIR }}
        run: |
          python3 <<'PATCHEOF'
          import io
          import re
          import sys


          def read(p):
              return io.open(p, encoding='utf-8', newline='').read()


          def write(p, s):
              io.open(p, 'w', encoding='utf-8', newline='').write(s)


          # ---------------- CMakeLists.txt ----------------
          p = 'CMakeLists.txt'
          s = read(p)
          nl = '\r\n' if '\r\n' in s[:4000] else '\n'

          # 1) 去掉 CYW43_LWIP=0（整行）
          s2 = re.sub(r'^[ \t]*CYW43_LWIP=0[ \t]*' + re.escape(nl), '', s, flags=re.M)
          if s2 == s:
              print('FAIL: CYW43_LWIP=0 那一行没找到')
              sys.exit(1)
          s = s2
          print('ok: 删掉 CYW43_LWIP=0')

          # 2) 在 add_executable(ds5-bridge ... ) 源文件列表末尾插入 src/wol_net.cpp
          anchor = 'add_executable(ds5-bridge'
          i = s.find(anchor)
          if i < 0:
              print('FAIL: 找不到 add_executable(ds5-bridge')
              sys.exit(1)
          j = s.find(nl + ')', i)
          if j < 0:
              print('FAIL: 找不到 add_executable 列表的结束括号')
              sys.exit(1)
          if 'wol_net.cpp' in s[i:j]:
              print('ok: src/wol_net.cpp 已在列表里')
          else:
              s = s[:j] + nl + '        src/wol_net.cpp' + s[j:]
              print('ok: 插入 src/wol_net.cpp')

          # 3) 链接库换成 lwip 版
          s2, n = re.subn(r'^([ \t]*)pico_cyw43_arch_poll[ \t]*$',
                          r'\1pico_cyw43_arch_lwip_poll', s, flags=re.M)
          if n != 1:
              print('FAIL: pico_cyw43_arch_poll 匹配 %d 次（应为 1）' % n)
              sys.exit(1)
          s = s2
          print('ok: pico_cyw43_arch_poll -> pico_cyw43_arch_lwip_poll')
          write(p, s)

          # ---------------- src/main.cpp ----------------
          p = 'src/main.cpp'
          s = read(p)
          nl = '\r\n' if '\r\n' in s[:4000] else '\n'


          def insert_after(text, anchor_text, addition, label):
              if addition.strip() in text:
                  print('ok: %s（已存在）' % label)
                  return text
              k = text.find(anchor_text)
              if k < 0:
                  print('FAIL: %s —— 锚点没找到: %r' % (label, anchor_text))
                  sys.exit(1)
              k += len(anchor_text)
              print('ok: %s' % label)
              return text[:k] + addition + text[k:]


          s = insert_after(s, nl + '#include "wake.h"' + nl,
                           '#include "wol_net.h"' + nl, '加 #include "wol_net.h"')
          s = insert_after(s, nl + '    wake_init();' + nl,
                           '    wol_net_init();' + nl, '加 wol_net_init();')
          s = insert_after(s, nl + '        cyw43_arch_poll();' + nl,
                           '        wol_net_poll();' + nl, '加 wol_net_poll();')
          write(p, s)

          print('==== 所有补丁已应用 ====')
          PATCHEOF

      - name: Inject Wi-Fi credentials from repository secrets (optional)
        working-directory: ${{ env.DS5_DIR }}
        env:
          WIFI_SSID: ${{ secrets.WOL_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WOL_WIFI_PASSWORD }}
          WOL_KEY: ${{ secrets.WOL_KEY }}
          WIFI_ENABLE: ${{ secrets.WOL_WIFI_ENABLE }}
        run: |
          if [ -z "$WIFI_SSID" ] && [ -z "$WOL_KEY" ] && [ -z "$WIFI_ENABLE" ]; then
            echo "没有配置 Secrets —— 直接用仓库里的 src/wol_config.h"
            exit 0
          fi
          python3 <<'PY'
          import io
          import os
          import re

          p = 'src/wol_config.h'
          s = io.open(p, encoding='utf-8', newline='').read()


          def repl(name, value):
              global s
              if not value:
                  return
              pat = re.compile(r'^(#define\s+' + name + r'\s+)".*?"', re.M)
              s, n = pat.subn(lambda m: m.group(1) + '"' + value + '"', s)
              print('  %s: %d replacement(s)' % (name, n))


          repl('WOL_WIFI_SSID', os.environ.get('WIFI_SSID', ''))
          repl('WOL_WIFI_PASSWORD', os.environ.get('WIFI_PASSWORD', ''))
          repl('WOL_KEY', os.environ.get('WOL_KEY', ''))

          en = os.environ.get('WIFI_ENABLE', '').strip()
          if en in ('0', '1'):
              s = re.sub(r'^(#define\s+WOL_WIFI_ENABLE\s+)\d+', r'\g<1>' + en, s, flags=re.M)
              print('  WOL_WIFI_ENABLE -> ' + en)

          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print('secret injection done')
          PY
          echo "--- 注入后的相关行（值已打码）---"
          grep -n 'WOL_WIFI_SSID\|WOL_WIFI_PASSWORD\|WOL_KEY\|WOL_WIFI_ENABLE' src/wol_config.h | sed 's/"[^"]*"/"***"/'

      - name: Configure
        working-directory: ${{ env.DS5_DIR }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$HOME/pico-sdk" \
            -DPICO_TOOLCHAIN_PATH="$HOME/arm-toolchain" \
            -DVERSION="${{ inputs.version }}"

      - name: Build
        working-directory: ${{ env.DS5_DIR }}
        run: cmake --build build --target ds5-bridge -j "$(nproc)"

      - name: Show firmware size
        working-directory: ${{ env.DS5_DIR }}
        run: |
          "$HOME/arm-toolchain/bin/arm-none-eabi-size" build/ds5-bridge.elf
          ls -l build/ds5-bridge.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ds5-bridge-wol-firmware
          path: |
            ${{ env.DS5_DIR }}/build/ds5-bridge.uf2
            ${{ env.DS5_DIR }}/build/ds5-bridge.elf
          if-no-files-found: error
